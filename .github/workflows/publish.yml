# Publishes the app to GitHub Pages without any merging.
#
# A push to a claude/ branch (where Claude commits new weeks) is merged into main,
# and main is then deployed. A push straight to main is deployed too.
#
# Pushes made with the workflow's own token don't start other workflows, so after
# updating main the sync job starts the deploy run on main itself.

name: Publish

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge this branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin main > /dev/null; then
            git fetch origin main
            git checkout -B main origin/main
            git merge --no-edit "$GITHUB_SHA"
          else
            git checkout -B main "$GITHUB_SHA"
          fi
          git push origin main
      - name: Deploy main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
